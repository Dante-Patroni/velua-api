name: CI - Velua API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: velua_test
      JWT_SECRET: secreto_solo_para_ci
      PORT: 3000

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: velua_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Esperar MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo 'Esperando MySQL...'
            sleep 2
          done

      - name: Migraciones
        run: npx sequelize-cli db:migrate

      - name: Seeds
        run: npx sequelize-cli db:seed:all

      - name: Levantar servidor
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Esperar que el servidor responda
        run: npx wait-on http://127.0.0.1:3000/api/v1/salud -t 60000

      - name: Tests E2E (Newman)
        run: npm test

      - name: Mostrar logs del servidor si falló
        if: failure()
        run: cat server.log

      - name: Detener servidor
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
